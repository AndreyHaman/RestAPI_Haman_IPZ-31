services:
  mongo_db:
    image: mongo:latest
    container_name: library_mongo_lab6
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    container_name: library_api_lab6
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo_admin:password@mongo_db:27017
    depends_on:
      - mongo_db

volumes:
  mongo_data: