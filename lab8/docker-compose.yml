services:
  mongo_db:
    image: mongo:latest
    container_name: library_mongo_lab8
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    ports:
      - "27017:27017"

  redis_cache:
    image: redis:latest
    container_name: library_redis_lab8
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: library_api_lab8
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo_admin:password@mongo_db:27017
      - REDIS_URL=redis://redis_cache:6379
    depends_on:
      - mongo_db
      - redis_cache

  prism_mock:
    image: stoplight/prism:latest
    container_name: library_prism_mock
    ports:
      - "4010:4010"
    volumes:
      - ./openapi.yaml:/api/openapi.yaml:ro
    command: mock -h 0.0.0.0 -m false -d /api/openapi.yaml